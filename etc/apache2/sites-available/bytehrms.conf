<VirtualHost *:443>
    ServerName hrms.example.com
    DocumentRoot /var/www/bytehrms/public

    SSLEngine on

    SSLCertificateFile       /etc/letsencrypt/live/hrms.example.net/fullchain.pem
    SSLCertificateKeyFile    /etc/letsencrypt/live/hrms.example.com/privkey.pem
        
    <Directory /var/www/bytehrms/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php login.php
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/hrms_error.log
    CustomLog ${APACHE_LOG_DIR}/hrms_access.log combined
</VirtualHost>
